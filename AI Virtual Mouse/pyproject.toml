[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-virtual-mouse-experimental"
version = "0.1.0"
description = "Experimental application skeleton for AI Virtual Mouse research prototype."
requires-python = ">=3.11"
dependencies = [
  "autopy",
  "mediapipe==0.10.14",
  "numpy==1.26.4",
  "opencv-python",
  "pygame",
]

[project.scripts]
ai-virtual-mouse-experimental = "ai_virtual_mouse_experimental.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
